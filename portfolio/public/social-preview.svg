<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="preview-title preview-description">
  <title id="preview-title">Gabriel Leal — Desenvolvedor frontend</title>
  <desc id="preview-description">Portfólio de Gabriel Leal. Tipografia monumental, molduras quadradas e azul sobre branco e preto. Projetos: Syndesis, Kodan, Bon, Naurial e BarberSchedule.</desc>
  <rect width="1200" height="630" fill="#f2f3f5"/>
  <rect x="60" y="32" width="64" height="54" fill="#111315"/>
  <g fill="#111315" font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="72" font-size="35" font-weight="900" letter-spacing="-2" fill="#f2f3f5">GL</text>
    <text x="152" y="65" font-size="17" font-family="monospace">DESENVOLVIMENTO FRONT-END</text>
    <text x="1140" y="65" text-anchor="end" font-size="17" font-family="monospace">REACT / TYPESCRIPT</text>
    <path d="M60 110H1140" fill="none" stroke="#111315" stroke-width="2"/>
    <text x="54" y="286" font-size="174" font-weight="900" letter-spacing="-9" textLength="790" lengthAdjust="spacingAndGlyphs">GABRIEL</text>
    <text x="760" y="446" font-size="140" font-weight="900" letter-spacing="-8" fill="none" stroke="#111315" stroke-width="2">LEAL</text>
    <text x="60" y="384" font-size="36" font-weight="700" letter-spacing="-1">Código, interface e</text>
    <text x="60" y="430" font-size="36" font-weight="700" letter-spacing="-1">atenção aos detalhes.</text>
    <path d="M1078 168H1140V230M1140 168L1068 240" fill="none" stroke="#0053c7" stroke-width="7"/>
    <path d="M60 484H1140" fill="none" stroke="#111315" stroke-width="2"/>
    <text x="60" y="520" font-size="15" font-family="monospace">PROJETOS SELECIONADOS</text>
    <g font-size="22" font-weight="800" letter-spacing="-.5">
      <text x="60" y="568">SYNDESIS</text>
      <text x="291" y="568">KODAN</text>
      <text x="482" y="568">BON</text>
      <text x="659" y="568">NAURIAL</text>
      <text x="877" y="568">BARBERSCHEDULE</text>
    </g>
    <g fill="#0053c7">
      <rect x="251" y="552" width="8" height="8"/>
      <rect x="442" y="552" width="8" height="8"/>
